name: wood
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  google_sign_in: ^6.2.2
  http: ^1.6.0
  crypto: ^3.0.3
  image_picker: ^1.2.3
  cached_network_image: ^3.4.1
  intl: ^0.20.3
  sign_in_button: ^5.0.0
  lottie: ^3.1.2
  speech_to_text: ^7.0.0
  flutter_native_splash: ^2.4.4
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^17.2.4
  onesignal_flutter: ^5.5.4
  app_badge_plus: ^1.2.0
  flutter_foreground_task: ^8.17.0
  screenshot: ^3.0.0
  gal: ^2.3.1
  flutter_image_compress: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_native_splash:
  color: "#42a5f5"
  image: assets/Images/Image_screen.jpg
  branding: assets/Images/Image_screen.jpg
  android_12:
    color: "#42a5f5"
    image: assets/Images/Image_screen.jpg

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icons_app.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/icons_app.png"

flutter:
  uses-material-design: true

  assets:
    - assets/Icons/
    - assets/Images/
    - assets/lottie/          # ⭐ เพิ่มบรรทัดนี้